services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: jobflow_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - ./docker/apache/vhost.conf:/etc/apache2/sites-available/000-default.conf
    networks:
      - jobflow_net

  db:
    image: mysql:8.0.30
    container_name: jobflow_db
    restart: always
    environment:
      MYSQL_DATABASE: jobflow
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - jobflow_net

  mongodb:
    image: mongo:7.0
    container_name: jobflow_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - jobflow_net

  # Intercepteur d'emails (Interface web sur port 8025)
  mailpit:
    image: axllent/mailpit
    container_name: jobflow_mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - jobflow_net

networks:
  jobflow_net:
    driver: bridge

volumes:
  mysql_data:
  mongo_data:
